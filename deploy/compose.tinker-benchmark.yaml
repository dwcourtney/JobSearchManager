name: jsm-benchmark

services:
  ollama:
    container_name: jsm-benchmark-ollama
    image: ${OLLAMA_IMAGE_REFERENCE:?Set exact Ollama image reference}
    user: "65532:65532"
    read_only: true
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      HOME: /tmp
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NOHISTORY: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all
    cpus: 4.0
    mem_limit: 7g
    volumes:
      - "${BENCHMARK_ROOT:?Set BENCHMARK_ROOT}/models/ollama:/models:ro"
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    restart: "no"
    networks: [classifier]

  deep-analysis:
    container_name: jsm-benchmark-deep-analysis
    image: ${DEEP_ANALYSIS_IMAGE_REFERENCE:?Set exact deep-analysis image reference}
    user: "65532:65532"
    read_only: true
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      OLLAMA_URL: http://ollama:11434
    depends_on:
      ollama: { condition: service_healthy }
    cpus: 1.0
    mem_limit: 256m
    tmpfs: [/tmp]
    restart: "no"
    networks: [classifier]

  runner:
    profiles: [run]
    image: ${BENCHMARK_IMAGE_REFERENCE:?Set exact benchmark image reference}
    user: "1001:1001"
    read_only: true
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      DEEP_ANALYSIS_URL: http://deep-analysis:8081/
    depends_on:
      deep-analysis: { condition: service_healthy }
    volumes:
      - "${BENCHMARK_ROOT:?Set BENCHMARK_ROOT}/evaluation:/benchmark"
    tmpfs: [/tmp]
    restart: "no"
    networks: [classifier]

networks:
  classifier:
    internal: true
