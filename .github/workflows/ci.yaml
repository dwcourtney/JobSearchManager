name: CI

on:
  pull_request:
    branches: [main]
  push:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source, tests, and C# CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require GitHub verification for pushed commit
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: bash scripts/verify-github-commit-signature.sh "$REPOSITORY" "$EXPECTED_SHA"

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install Node.js for source validation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          check-latest: false

      - name: Initialize C# CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Validate source, tests, image, health, and version identity
        shell: bash
        run: bash scripts/ci-validate.sh "$EXPECTED_SHA"

      - name: Produce labeled detector evaluation report
        shell: bash
        run: dotnet run --project Tests/JobSearchManager.Tests.csproj --configuration Release --no-build -- --detector-evaluation detector-evaluation.json "$EXPECTED_SHA"

      - name: Upload labeled detector evaluation report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: detector-evaluation-${{ env.EXPECTED_SHA }}
          path: detector-evaluation.json
          if-no-files-found: error
          retention-days: 30

      - name: Analyze C# with CodeQL
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:csharp

  javascript-codeql:
    name: Analyze JavaScript with CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize JavaScript CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyze JavaScript with CodeQL
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:javascript-typescript

  exact-commit:
    name: Validate exact commit
    if: ${{ always() }}
    needs:
      - validate
      - javascript-codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every exact-SHA validation job
        shell: bash
        env:
          CSHARP_RESULT: ${{ needs.validate.result }}
          JAVASCRIPT_RESULT: ${{ needs.javascript-codeql.result }}
        run: |
          set -Eeuo pipefail
          [[ "$CSHARP_RESULT" == 'success' ]]
          [[ "$JAVASCRIPT_RESULT" == 'success' ]]
