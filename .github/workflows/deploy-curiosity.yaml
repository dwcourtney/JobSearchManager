name: Deploy curiosity

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: Deploy current main or a validated commit already in main history
        required: true
        default: main
        type: choice
        options:
          - main
          - commit
      commit_sha:
        description: Lowercase full SHA; required only when target is commit
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: jsm-curiosity-deployment
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve trusted deployment commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      deploy: ${{ steps.resolve.outputs.deploy }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Check out main for manual commit validation
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact trusted SHA
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          AUTO_DEPLOY: ${{ vars.CURIOSITY_AUTO_DEPLOY }}
          MANUAL_TARGET: ${{ inputs.target }}
          MANUAL_SHA: ${{ inputs.commit_sha }}
        run: |
          set -Eeuo pipefail
          deploy=false
          sha=''

          if [[ "$EVENT_NAME" == 'workflow_run' ]]; then
            if [[ "$RUN_EVENT" == 'push' && "$RUN_BRANCH" == 'main' && "$RUN_CONCLUSION" == 'success' && "$AUTO_DEPLOY" == 'true' ]]; then
              [[ "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]]
              deploy=true
              sha="$RUN_SHA"
            fi
          else
            main_sha="$(git rev-parse origin/main)"
            if [[ "$MANUAL_TARGET" == 'main' ]]; then
              sha="$main_sha"
            elif [[ "$MANUAL_TARGET" == 'commit' && "$MANUAL_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              git cat-file -e "${MANUAL_SHA}^{commit}"
              git merge-base --is-ancestor "$MANUAL_SHA" "$main_sha"
              sha="$MANUAL_SHA"
            else
              echo 'Manual deployment requires main or a lowercase full commit SHA.' >&2
              exit 2
            fi
            deploy=true
          fi

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  validate-manual:
    name: Revalidate manual deployment
    if: github.event_name == 'workflow_dispatch' && needs.resolve.outputs.deploy == 'true'
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Check out exact requested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Install Node.js for source validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          check-latest: false

      - name: Re-run all trusted validation gates
        shell: bash
        run: bash scripts/ci-validate.sh "$EXPECTED_SHA"

  deploy:
    name: Deploy exact commit to curiosity
    if: >-
      always() &&
      needs.resolve.outputs.deploy == 'true' &&
      (github.event_name == 'workflow_run' || needs.validate-manual.result == 'success')
    needs: [resolve, validate-manual]
    runs-on: [self-hosted, linux, x64, curiosity, jsm]
    timeout-minutes: 45
    environment: curiosity
    env:
      DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Check out exact validated commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout and deploy only JSM
        shell: bash
        run: bash scripts/deploy-curiosity.sh "$DEPLOY_SHA" "$GITHUB_WORKSPACE"
