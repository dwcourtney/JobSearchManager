name: jsm-lab

services:
  jsm:
    build:
      context: .
      dockerfile: Dockerfile
    user: "1001:1001"
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      JOBSEARCHMANAGER_HOSTING_MODE: Container
      JOBSEARCHMANAGER_DATA_PROTECTION_PATH: /var/lib/jsm/dataprotection
      JOBSEARCHMANAGER_PUBLIC_BASE_URL: http://192.168.1.20:8080
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Application__OpenBrowser: "false"
      Application__RefreshOnStartup: "false"
      DOTNET_ENVIRONMENT: Production
      DeepAnalysis__BaseUrl: http://deep-analysis:8081/
    ports:
      - "192.168.1.20:8080:8080"
    volumes:
      - "./data/app:/app/data"
      - "./data/dataprotection:/var/lib/jsm/dataprotection"
    tmpfs:
      - /tmp
    restart: unless-stopped
    networks:
      - default
      - classifier

  deep-analysis:
    build:
      context: .
      dockerfile: classifier-service/Dockerfile
    user: "65532:65532"
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      OLLAMA_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 256m
    tmpfs:
      - /tmp
    restart: unless-stopped
    networks:
      - classifier

  ollama:
    build:
      context: ollama-runtime
      dockerfile: Dockerfile
    user: "65532:65532"
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      HOME: /tmp
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NOHISTORY: "1"
    volumes:
      - "./data/ollama:/models"
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    networks:
      - classifier

networks:
  classifier:
    internal: true
