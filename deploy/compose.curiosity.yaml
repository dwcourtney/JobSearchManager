name: jsm-lab

services:
  jsm:
    image: ${JSM_IMAGE_REFERENCE:?Set JSM_IMAGE_REFERENCE to an exact JSM image tag}
    user: "1001:1001"
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      JOBSEARCHMANAGER_HOSTING_MODE: Container
      JOBSEARCHMANAGER_DATA_PROTECTION_PATH: /var/lib/jsm/dataprotection
      JOBSEARCHMANAGER_ADMIN_BOOTSTRAP_PATH: /app/data/admin-bootstrap-code
      JOBSEARCHMANAGER_PUBLIC_BASE_URL: http://192.168.1.20:8080
      JOBSEARCHMANAGER_SMTP_HOST: mailpit
      JOBSEARCHMANAGER_SMTP_PORT: "1025"
      JOBSEARCHMANAGER_SMTP_ENABLE_SSL: "false"
      JOBSEARCHMANAGER_EMAIL_FROM: jsm@local.invalid
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Application__OpenBrowser: "false"
      Application__RefreshOnStartup: "false"
      DOTNET_ENVIRONMENT: Production
      Classifier__BaseUrl: http://job-classifier:8081/
    ports:
      - "192.168.1.20:8080:8080"
    volumes:
      - "${JSM_LAB_ROOT:-/home/codex/jsm-lab}/data/app:/app/data"
      - "${JSM_LAB_ROOT:-/home/codex/jsm-lab}/data/dataprotection:/var/lib/jsm/dataprotection"
    tmpfs:
      - /tmp
    restart: unless-stopped
    networks:
      - default
      - classifier

  job-classifier:
    image: ${CLASSIFIER_IMAGE_REFERENCE:?Set CLASSIFIER_IMAGE_REFERENCE to an exact classifier image tag}
    user: "65532:65532"
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      CLASSIFIER_MODEL_ROOT: /models/nli-distilroberta-base
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HOME: /tmp
    gpus: all
    cpus: 2.0
    mem_limit: 4g
    volumes:
      - "${JSM_LAB_ROOT:-/home/codex/jsm-lab}/models/nli-distilroberta-base:/models/nli-distilroberta-base:ro"
    tmpfs:
      - /tmp
    restart: unless-stopped
    networks:
      - classifier

networks:
  classifier:
    internal: true
