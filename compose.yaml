name: jsm-lab

services:
  jsm:
    build:
      context: .
      dockerfile: Dockerfile
    user: "1001:1001"
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      JOBSEARCHMANAGER_HOSTING_MODE: Container
      JOBSEARCHMANAGER_DATA_PROTECTION_PATH: /var/lib/jsm/dataprotection
      JOBSEARCHMANAGER_PUBLIC_BASE_URL: http://192.168.1.20:8080
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Application__OpenBrowser: "false"
      Application__RefreshOnStartup: "false"
      DOTNET_ENVIRONMENT: Production
    ports:
      - "192.168.1.20:8080:8080"
    volumes:
      - "./data/app:/app/data"
      - "./data/dataprotection:/var/lib/jsm/dataprotection"
    tmpfs:
      - /tmp
    restart: unless-stopped
